# Stack único de InsiDesk: postgres + redis + app (backend y frontend en UN
# contenedor). Pensado para desplegarse como Stack en Portainer o con
# `docker compose up -d`.
#
# El código NO se copia a ninguna imagen: PROJECT_DIR (ruta absoluta de esta
# carpeta en el host) se monta en /app y docker/entrypoint.sh instala
# dependencias, compila y sirve al iniciar. Para actualizar: actualizar el
# código en el host (git pull) y reiniciar el contenedor `app`.
#
# Variables: ver .env.stack.example. Las obligatorias fallan al levantar si
# faltan (mejor eso que arrancar con un secreto vacío).

services:
  postgres:
    image: postgres:15-alpine
    container_name: tickets_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tickets_db}
      POSTGRES_USER: ${DB_USER:-ticketsuser}
      # Solo se aplica al crear el volumen por primera vez; cambiarla después
      # requiere ALTER USER (ver .env.stack.example).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es requerido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Solo loopback: útil para psql/Adminer desde el mismo servidor, sin exponer
    # la base a la red.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - tickets_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ticketsuser} -d ${DB_NAME:-tickets_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tickets_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD es requerido} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - tickets_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *default-logging
    restart: unless-stopped

  app:
    build:
      context: ./docker
      dockerfile: app.Dockerfile
    image: insidesk-app:local
    container_name: tickets_app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-ticketsuser}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-tickets_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es requerido}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET es requerido}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY es requerido (openssl rand -hex 32)}
      # Mismo origen (nginx del contenedor sirve SPA y API): no hace falta CORS
      # salvo que se consuma la API desde otro dominio.
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN es requerido (URL pública, ej. https://soporte.tuempresa.com)}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL es requerido}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      # 1 = solo el nginx de este contenedor. Subir a 2 si hay otro proxy
      # delante (Traefik, Nginx Proxy Manager, Cloudflare...).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # true solo cuando se sirva por HTTPS — con HTTP plano el navegador
      # descarta cookies Secure y nadie puede loguearse.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      REMOTELY_SERVER_URL: ${REMOTELY_SERVER_URL:-}
      REMOTELY_API_KEY: ${REMOTELY_API_KEY:-}
      REMOTELY_ORGANIZATION_ID: ${REMOTELY_ORGANIZATION_ID:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_DIR: /data/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Se hornean en el bundle del frontend al compilar (ver entrypoint.sh).
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_REMOTELY_URL: ${VITE_REMOTELY_URL:-}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    volumes:
      # El proyecto, montado (no copiado). Sin :ro a propósito: en un clon nuevo
      # Docker necesita crear los puntos de montaje de node_modules dentro.
      - ${PROJECT_DIR:?PROJECT_DIR es requerido (ruta ABSOLUTA de esta carpeta en el host)}:/app
      # Dependencias Linux, separadas de las del host (binarios de Prisma/etc.).
      - backend_node_modules:/app/backend/node_modules
      - frontend_node_modules:/app/frontend/node_modules
      # Salida compilada.
      - app_build:/build
      # Datos persistentes.
      - backend_uploads:/data/uploads
      - backend_backups:/data/backups
      - backend_logs:/data/logs
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tickets_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/db | grep -q connected"]
      interval: 30s
      timeout: 5s
      retries: 3
      # El primer arranque instala dependencias y compila (varios minutos).
      start_period: 600s
    logging: *default-logging
    restart: unless-stopped

# name: fijo — el volumen se llama igual sin importar el nombre del stack en
# Portainer, y conserva la base ya existente (insidesk_postgres_data).
volumes:
  postgres_data:
    name: insidesk_postgres_data
  redis_data:
    name: insidesk_redis_data
  backend_node_modules:
    name: insidesk_backend_node_modules
  frontend_node_modules:
    name: insidesk_frontend_node_modules
  app_build:
    name: insidesk_app_build
  backend_uploads:
    name: insidesk_backend_uploads
  backend_backups:
    name: insidesk_backend_backups
  backend_logs:
    name: insidesk_backend_logs

networks:
  tickets_network:
    driver: bridge
