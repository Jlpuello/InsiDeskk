version: '3.8'

services:
  # ════════════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: tickets_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tickets_db}
      POSTGRES_USER: ${DB_USER:-ticketsuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tickets_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ticketsuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════
  # Redis (cache, pub/sub, colas)
  # ════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: tickets_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tickets_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════
  # Backend API
  # ════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tickets_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-ticketsuser}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-tickets_db}
      JWT_SECRET: ${JWT_SECRET}
      REMOTELY_SERVER_URL: ${REMOTELY_SERVER_URL}
      REMOTELY_API_KEY: ${REMOTELY_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      REDIS_DB: ${REDIS_DB:-0}
      CACHE_TTL: ${CACHE_TTL:-3600}
      CACHE_DEVICES_TTL: ${CACHE_DEVICES_TTL:-300}
      CACHE_TICKETS_TTL: ${CACHE_TICKETS_TTL:-600}
      QUEUE_NAME: ${QUEUE_NAME:-tickets-queue}
      QUEUE_WORKERS: ${QUEUE_WORKERS:-2}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-5}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tickets_network
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════
  # Frontend
  # ════════════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tickets_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      VITE_REMOTELY_URL: ${VITE_REMOTELY_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - tickets_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  tickets_network:
    driver: bridge
