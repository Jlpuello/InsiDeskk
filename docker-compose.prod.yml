version: '3.8'

# Variante de producción de docker-compose.yml (que queda intacto para dev):
# sin bind mounts de código fuente (las imágenes ya traen el build compilado
# — un bind mount de ./backend/src encima pisaría justamente lo que se acaba
# de compilar), y con volúmenes nombrados para uploads/ y backups/, que en el
# compose de dev no existían y se perdían en cada recreación del contenedor.

services:
  postgres:
    image: postgres:15-alpine
    container_name: tickets_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tickets_db}
      POSTGRES_USER: ${DB_USER:-ticketsuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es requerido en producción}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tickets_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ticketsuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tickets_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD es requerido en producción} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - tickets_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tickets_backend
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-ticketsuser}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-tickets_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es requerido}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET es requerido}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY es requerido (openssl rand -hex 32)}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN es requerido (dominio real del frontend)}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL es requerido}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      REMOTELY_SERVER_URL: ${REMOTELY_SERVER_URL:-}
      REMOTELY_API_KEY: ${REMOTELY_API_KEY:-}
      REMOTELY_ORGANIZATION_ID: ${REMOTELY_ORGANIZATION_ID:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      CACHE_TTL: ${CACHE_TTL:-3600}
      CACHE_DEVICES_TTL: ${CACHE_DEVICES_TTL:-300}
      CACHE_TICKETS_TTL: ${CACHE_TICKETS_TTL:-600}
      QUEUE_NAME: ${QUEUE_NAME:-tickets-queue}
      QUEUE_WORKERS: ${QUEUE_WORKERS:-2}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-5}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_DIR: /app/backups
    ports:
      - "3000:3000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tickets_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL es requerido (URL pública del backend + /api)}
        VITE_REMOTELY_URL: ${VITE_REMOTELY_URL:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    container_name: tickets_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tickets_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_backups:
  backend_logs:

networks:
  tickets_network:
    driver: bridge
